plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thegate.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thegate.tv'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.0.4'

        // GATE_URL is injected from gradle.properties so each operator can
        // point the APK at their own LAN host without editing source files.
        def gateUrl = project.findProperty('GATE_URL') ?: 'http://192.0.2.10:5501/'
        buildConfigField "String", "GATE_URL", "\"${gateUrl}\""
    }

    buildFeatures {
        buildConfig true
    }
}
